name: OBSI V1 checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python compile and tests
        run: |
          python3 -m compileall -q src bin tests
          python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n installer/*.sh \
            bin/obsi-workspace \
            bin/obsi-configure-input \
            bin/obsi-configure-vfio \
            bin/obsi-network-setup \
            libvirt/hooks/qemu \
            guest/linux/obsi-grow-root
